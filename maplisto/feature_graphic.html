<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Graphic Generator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .container {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* Background pattern */
        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.1;
            background-image: radial-gradient(#ffffff 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .content {
            display: flex;
            align-items: center;
            gap: 60px;
            z-index: 2;
        }

        .icon-box {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .icon-box img {
            width: 160px;
            height: 160px;
            object-fit: contain;
        }

        .text-group {
            color: white;
        }

        h1 {
            font-size: 80px;
            margin: 0;
            font-weight: 800;
            letter-spacing: -2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 32px;
            margin: 10px 0 0 5px;
            opacity: 0.9;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="pattern"></div>
        <div class="content">
            <div class="icon-box">
                <!-- Adjust path if needed, assumes release_icon.png is in same folder or relatively accessible -->
                <img src="release_icon.png" alt="Icon">
            </div>
            <div class="text-group">
                <h1>Maplisto</h1>
                <p>Track. Share. Explore.</p>
            </div>
        </div>
    </div>
</body>

</html>
